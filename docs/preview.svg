<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-label="鲸语设置页示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17181b"/>
      <stop offset="1" stop-color="#111214"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#3d6fe0"/>
    </linearGradient>
  </defs>

  <rect width="760" height="470" fill="url(#bg)"/>

  <!-- 设置卡片 -->
  <rect x="28" y="26" width="704" height="392" rx="16" fill="#1e1f24" stroke="#2e3037" stroke-width="1"/>

  <!-- 头部图标 -->
  <rect x="56" y="56" width="34" height="34" rx="10" fill="url(#blue)"/>
  <g fill="#ffffff">
    <path d="M66 66.5 61.5 70.5h-3v5h3l4.5 4v-13Z"/>
    <path d="M75.6 69.4a4.6 4.6 0 0 1 0 6.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <text x="102" y="72" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="600" fill="#e9eaee">鲸语</text>
  <text x="102" y="90" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#8f919b">给每条回复装一副能开口的嗓子</text>

  <line x1="56" y1="118" x2="704" y2="118" stroke="#2e3037" stroke-width="1"/>

  <!-- 音色行 -->
  <text x="56" y="150" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#9b9da7">音色</text>

  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11.5">
    <rect x="300" y="132" width="88" height="26" rx="7" fill="#233256" stroke="#5b8cff" stroke-width="1.2"/>
    <text x="344" y="149" fill="#cfe0ff" text-anchor="middle">晓伊 · 活泼</text>

    <rect x="396" y="132" width="88" height="26" rx="7" fill="none" stroke="#3a3d45" stroke-width="1.2"/>
    <text x="440" y="149" fill="#a9abb4" text-anchor="middle">晓晓 · 温柔</text>

    <rect x="492" y="132" width="88" height="26" rx="7" fill="none" stroke="#3a3d45" stroke-width="1.2"/>
    <text x="536" y="149" fill="#a9abb4" text-anchor="middle">小北 · 俏皮</text>

    <rect x="588" y="132" width="88" height="26" rx="7" fill="none" stroke="#3a3d45" stroke-width="1.2"/>
    <text x="632" y="149" fill="#a9abb4" text-anchor="middle">小妮 · 明亮</text>
  </g>

  <!-- 语速 / 音调 -->
  <text x="56" y="202" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#9b9da7">语速</text>
  <rect x="120" y="184" width="92" height="26" rx="7" fill="#26282e" stroke="#3a3d45" stroke-width="1.2"/>
  <text x="152" y="201" font-family="system-ui, sans-serif" font-size="11.5" fill="#c4c6cd">+6%</text>
  <path d="M190 195l4 4 4-4" fill="none" stroke="#8f919b" stroke-width="1.6" stroke-linecap="round"/>

  <text x="250" y="202" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#9b9da7">音调</text>
  <rect x="314" y="184" width="92" height="26" rx="7" fill="#26282e" stroke="#3a3d45" stroke-width="1.2"/>
  <text x="346" y="201" font-family="system-ui, sans-serif" font-size="11.5" fill="#c4c6cd">+10Hz</text>
  <path d="M384 195l4 4 4-4" fill="none" stroke="#8f919b" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 自动朗读 -->
  <rect x="56" y="238" width="15" height="15" rx="4" fill="#4176e6"/>
  <path d="M59.5 245.5l2 2 4-4.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="250" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#b9bbc3">自动朗读新回复</text>

  <!-- 按钮 -->
  <rect x="56" y="282" width="104" height="32" rx="9" fill="url(#blue)"/>
  <text x="108" y="303" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">试听这一档</text>

  <rect x="172" y="282" width="72" height="32" rx="9" fill="none" stroke="#3a3d45" stroke-width="1.2"/>
  <text x="208" y="303" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#a9abb4" text-anchor="middle">别说了</text>

  <!-- 规矩提示 -->
  <rect x="56" y="330" width="648" height="30" rx="8" fill="#1a1b1f"/>
  <text x="70" y="349" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11" fill="#7f818b">朗读规矩：标点不念出来，只用它提示语气与停顿；代码块、表情和 Markdown 记号都会跳过。</text>

  <!-- 消息下方按钮 -->
  <line x1="56" y1="380" x2="704" y2="380" stroke="#2e3037" stroke-width="1"/>

  <rect x="56" y="396" width="80" height="28" rx="8" fill="none" stroke="#3a3d45" stroke-width="1.2"/>
  <g fill="#a9abb4">
    <path d="M68 404 63.5 408h-3v5h3l4.5 4v-13Z"/>
    <path d="M78 406.6a4.6 4.6 0 0 1 0 6.8" fill="none" stroke="#a9abb4" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <text x="88" y="415" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" fill="#c4c6cd">朗读</text>
  <text x="150" y="415" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11" fill="#6c6e78">← 每条回复下面长这样</text>
</svg>
